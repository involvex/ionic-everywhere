name: Artifacts

# Manual, conservative three-target build. Kept out of CI so pushes stay green
# without Android SDK/JDK setup; run it from the Actions tab when validating a
# release candidate.
on:
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: bun install --frozen-lockfile
      - run: bun run --filter @involvex/ionic-everywhere build
      - name: Scaffold and build debug APK
        run: |
          bun packages/ionic-everywhere/dist/cli.js new .test/artifacts-android --yes --pm bun --no-git
          cd .test/artifacts-android
          bun run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: .test/artifacts-android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop-pack-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run --filter @involvex/ionic-everywhere build
      - name: Scaffold and pack desktop app
        run: |
          bun packages/ionic-everywhere/dist/cli.js new .test/artifacts-desktop --yes --pm bun --no-git
          cd .test/artifacts-desktop
          bun run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-dist
          path: .test/artifacts-desktop/electron/dist/*
          if-no-files-found: error
