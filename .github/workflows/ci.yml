name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Bun
        run: |
          BUN_INSTALL_VERSION=1.4.1 curl -fsSL https://bun.sh/install | bash
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_PATH=$(bun --get-home 2>/dev/null || echo "$HOME/.bun/bin")
          else
            BUN_PATH="$HOME/.bun/bin"
          fi
          echo "$BUN_PATH" >> "$GITHUB_PATH"
          echo "bun installed at: $BUN_PATH"
          command -v bun && bun --version
        shell: bash
      - name: Cache bun install cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run ci:lint-test
      - name: Upload CLI dist
        uses: actions/upload-artifact@v5
        with:
          name: cli-dist
          path: packages/ionic-everywhere/dist/
          retention-days: 1

  scaffold-smoke:
    needs: lint-test
    # FEAT-035: run on both OSes - path/PATHEXT regressions (gradlew, where.exe
    # probes) previously shipped undetected with an ubuntu-only smoke job.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install Bun
        run: |
          BUN_INSTALL_VERSION=1.4.1 curl -fsSL https://bun.sh/install | bash
          if [ "$RUNNER_OS" = "Windows" ]; then
            BUN_PATH=$(bun --get-home 2>/dev/null || echo "$HOME/.bun/bin")
          else
            BUN_PATH="$HOME/.bun/bin"
          fi
          echo "$BUN_PATH" >> "$GITHUB_PATH"
          echo "bun installed at: $BUN_PATH"
          command -v bun && bun --version
        shell: bash
      - name: Cache bun install cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Download CLI dist from lint-test
        uses: actions/download-artifact@v5
        with:
          name: cli-dist
          path: packages/ionic-everywhere/dist/
      - run: bun install --frozen-lockfile
      # End-to-end: scaffold web+android+desktop app, assert output,
      # then web-build the result (FEAT-027) to catch dependency drift.
      # Needs no JDK/Android SDK - `cap add android` only copies the platform.
      - run: bun scripts/cli-test.mjs
      # FEAT-029: age a fresh scaffold, `upgrade --yes`, assert restoration.
      - run: bun scripts/cli-test-upgrade.mjs
