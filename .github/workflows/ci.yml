name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Bun
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            if command -v pwsh >/dev/null 2>&1; then
              pwsh -NoLogo -NoProfile -Command '$null = iex "& {irm bun.sh/install.ps1} -Version 1.4.1"'
            else
              powershell -NoLogo -NoProfile -Command '$null = iex "& {irm bun.sh/install.ps1} -Version 1.4.1"'
            fi
          else
            curl -fsSL https://bun.sh/install | bash -s -- "1.4.1"
          fi
          BUN_PATH="$HOME/.bun/bin"
          echo "$BUN_PATH" >> "$GITHUB_PATH"
          "$BUN_PATH/bun" --version
        shell: bash
      - name: Cache bun install cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run ci:lint-test
      - name: Upload CLI dist
        uses: actions/upload-artifact@v5
        with:
          name: cli-dist
          path: packages/ionic-everywhere/dist/
          retention-days: 1

  scaffold-smoke:
    needs: lint-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install Bun
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            if command -v pwsh >/dev/null 2>&1; then
              pwsh -NoLogo -NoProfile -Command '$null = iex "& {irm bun.sh/install.ps1} -Version 1.4.1"'
            else
              powershell -NoLogo -NoProfile -Command '$null = iex "& {irm bun.sh/install.ps1} -Version 1.4.1"'
            fi
          else
            curl -fsSL https://bun.sh/install | bash -s -- "1.4.1"
          fi
          BUN_PATH="$HOME/.bun/bin"
          echo "$BUN_PATH" >> "$GITHUB_PATH"
          "$BUN_PATH/bun" --version
        shell: bash
      - name: Cache bun install cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Download CLI dist from lint-test
        uses: actions/download-artifact@v5
        with:
          name: cli-dist
          path: packages/ionic-everywhere/dist/
      - run: bun install --frozen-lockfile
      - name: 'CLI smoke: scaffold + build'
        run: bun scripts/cli-test.mjs
      - name: 'CLI smoke: upgrade round-trip'
        run: bun scripts/cli-test-upgrade.mjs