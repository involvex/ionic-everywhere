name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Bun
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            curl -fsSL -o /tmp/bun.zip \
              https://github.com/oven-sh/bun/releases/download/bun-v1.4.1/bun-windows-x64.zip
            unzip -q /tmp/bun.zip -d /tmp/bun-extract
            mkdir -p ~/.bun/bin
            mv /tmp/bun-extract/bun-windows-x64/bun.exe ~/.bun/bin/
            rm -rf /tmp/bun.zip /tmp/bun-extract
          else
            curl -fsSL https://bun.sh/install | bash
          fi
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version
        shell: bash
      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run ci:lint-test
      - name: Upload CLI dist
        uses: actions/upload-artifact@v5
        with:
          name: cli-dist
          path: packages/ionic-everywhere/dist/
          retention-days: 1

  scaffold-smoke:
    needs: lint-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install Bun
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            curl -fsSL -o /tmp/bun.zip \
              https://github.com/oven-sh/bun/releases/download/bun-v1.4.1/bun-windows-x64.zip
            unzip -q /tmp/bun.zip -d /tmp/bun-extract
            mkdir -p ~/.bun/bin
            mv /tmp/bun-extract/bun-windows-x64/bun.exe ~/.bun/bin/
            rm -rf /tmp/bun.zip /tmp/bun-extract
          else
            curl -fsSL https://bun.sh/install | bash
          fi
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version
        shell: bash
      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Download CLI dist from lint-test
        uses: actions/download-artifact@v5
        with:
          name: cli-dist
          path: packages/ionic-everywhere/dist/
      - run: bun install --frozen-lockfile
      - name: 'CLI smoke: scaffold + build'
        run: bun scripts/cli-test.mjs
      - name: 'CLI smoke: upgrade round-trip'
        run: bun scripts/cli-test-upgrade.mjs