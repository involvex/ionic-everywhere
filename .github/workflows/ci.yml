name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        # Stable bun only - canary builds produce broken installs (AGENTS.md #10)
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bunx tsc -p packages/ionic-everywhere/tsconfig.json --noEmit
      - run: bun run build

  scaffold-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # End-to-end: build CLI, scaffold web+android+desktop app, assert output.
      # Needs no JDK/Android SDK - `cap add android` only copies the platform.
      - run: bun scripts/cli-test.mjs
