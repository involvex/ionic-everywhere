name: CI

env:
  # Absolute path to bun so run.ts can inject it into cmd.exe PATH on Windows
  BUN_BIN: ${{ env.HOME }}/.bun/bin/bun
  PATH: ${{ env.HOME }}/.bun/bin${{ ':${PATH}' if runner.os == 'Windows' else ':${PATH}' }}

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Bun
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mkdir -p "$HOME/.bun/bin"
            curl.exe -fsSL -o /tmp/bun.zip ^
              https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-windows-x64.zip
            python3 -m zipfile -e /tmp/bun.zip /tmp/bun-extract
            mv /tmp/bun-extract/bun-windows-x64/bun.exe "$HOME/.bun/bin/bun.exe"
            cp /tmp/bun-extract/bun-windows-x64/bunx.exe "$HOME/.bun/bin/bunx.exe" 2>/dev/null || true
            rm -rf /tmp/bun.zip /tmp/bun-extract
            setx PATH "%USERPROFILE%\.bun\bin;%PATH%" >/dev/null 2>&1 || true
          else
            curl -fsSL -o /tmp/bun.zip \
              https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
            python3 -m zipfile -e /tmp/bun.zip /tmp/bun-extract
            mkdir -p ~/.bun/bin
            mv /tmp/bun-extract/bun-linux-x64/bun ~/.bun/bin/bun
            cp /tmp/bun-extract/bun-linux-x64/bunx ~/.bun/bin/bunx 2>/dev/null || true
            rm -rf /tmp/bun.zip /tmp/bun-extract
            chmod +x ~/.bun/bin/bun ~/.bun/bin/bunx 2>/dev/null || true
          fi
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version
        shell: bash
      - name: Cache bun install cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run ci:lint-test
      - name: Upload CLI dist
        uses: actions/upload-artifact@v5
        with:
          name: cli-dist
          path: packages/ionic-everywhere/dist/
          retention-days: 1

  scaffold-smoke:
    defaults:
      run:
        shell: bash
    needs: lint-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install Bun
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mkdir -p "$HOME/.bun/bin"
            curl.exe -fsSL -o /tmp/bun.zip ^
              https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-windows-x64.zip
            python3 -m zipfile -e /tmp/bun.zip /tmp/bun-extract
            mv /tmp/bun-extract/bun-windows-x64/bun.exe "$HOME/.bun/bin/bun.exe"
            cp /tmp/bun-extract/bun-windows-x64/bunx.exe "$HOME/.bun/bin/bunx.exe" 2>/dev/null || true
            rm -rf /tmp/bun.zip /tmp/bun-extract
            setx PATH "%USERPROFILE%\.bun\bin;%PATH%" >/dev/null 2>&1 || true
          else
            curl -fsSL -o /tmp/bun.zip \
              https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
            python3 -m zipfile -e /tmp/bun.zip /tmp/bun-extract
            mkdir -p ~/.bun/bin
            mv /tmp/bun-extract/bun-linux-x64/bun ~/.bun/bin/bun
            cp /tmp/bun-extract/bun-linux-x64/bunx ~/.bun/bin/bunx 2>/dev/null || true
            rm -rf /tmp/bun.zip /tmp/bun-extract
            chmod +x ~/.bun/bin/bun ~/.bun/bin/bunx 2>/dev/null || true
          fi
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version
        shell: bash
      - name: Cache bun install cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Download CLI dist from lint-test
        uses: actions/download-artifact@v5
        with:
          name: cli-dist
          path: packages/ionic-everywhere/dist/
      - run: bun install --frozen-lockfile
      - name: 'CLI smoke: scaffold + build'
        run: bun scripts/cli-test.mjs
      - name: 'CLI smoke: upgrade round-trip'
        run: bun scripts/cli-test-upgrade.mjs
