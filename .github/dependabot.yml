version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript is pinned to ^5.9.3 (see AGENTS.md); TS 7 native
      # binary uses per-platform optionalDeps that bun silently skips.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
